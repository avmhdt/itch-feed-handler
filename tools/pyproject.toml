[project]
name = "itchtools"
version = "0.1.0"
description = "Download, validation, baseline and figure tooling for itch-feed-handler"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "polars>=1.0",
    "pyarrow>=17",
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.scripts]
itchtools = "itchtools.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itchtools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not data'"
markers = ["data: needs the real Nasdaq sample files (local only, never CI)"]

[tool.coverage.run]
source = ["itchtools"]
branch = false

[tool.coverage.report]
fail_under = 85
