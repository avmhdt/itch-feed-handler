repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format-18 -i
        language: system
        types_or: [c++]
      - id: no-market-data
        name: reject market data files
        entry: scripts/check_repo_hygiene.sh
        language: system
        pass_filenames: false
